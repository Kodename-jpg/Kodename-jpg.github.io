<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="420" height="280" rx="8" fill="#ffffff"/>
<text x="210" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c2c2c">FAT32 vs exFAT untuk flashdisk Ventoy</text>
<rect x="20" y="44" width="185" height="170" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<text x="112" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">FAT32</text>
<text x="34" y="102" font-size="13" fill="#2e7d32">&#10003; Kedetek di HP</text>
<text x="34" y="126" font-size="13" fill="#2e7d32">&#10003; ISO di bawah 4 GB</text>
<text x="34" y="150" font-size="13" fill="#b71c1c">&#10007; File di atas 4 GB</text>
<text x="34" y="170" font-size="13" fill="#666666">tidak bisa disimpan</text>
<rect x="215" y="44" width="185" height="170" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<text x="307" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">exFAT</text>
<text x="229" y="102" font-size="13" fill="#2e7d32">&#10003; ISO besar bisa disimpan</text>
<text x="229" y="126" font-size="13" fill="#b71c1c">&#10007; Sering tidak terdeteksi</text>
<text x="229" y="150" font-size="13" fill="#666666">di HP</text>
<text x="210" y="242" text-anchor="middle" font-size="13" fill="#666666">Pilih FAT32 kalau ISO-mu di bawah 4 GB dan</text>
<text x="210" y="262" text-anchor="middle" font-size="13" fill="#666666">mau flashdisk kedetek di HP.</text>
</svg>
