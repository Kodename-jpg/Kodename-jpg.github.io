<svg xmlns="http://www.w3.org/2000/svg" width="420" height="282" viewBox="0 0 420 282" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="420" height="282" rx="8" fill="#ffffff"/>
<text x="210" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c2c2c">Install flow: Ollama → model → Open WebUI</text>
<rect x="60" y="54" width="300" height="34" rx="4" fill="#55557f"/>
<text x="210" y="76" text-anchor="middle" font-size="13" fill="#ffffff">1. Install Ollama</text>
<line x1="210" y1="88" x2="210" y2="94" stroke="#55557f" stroke-width="2"/>
<polygon points="210,100 205,93 215,93" fill="#55557f"/>
<rect x="60" y="100" width="300" height="34" rx="4" fill="#55557f"/>
<text x="210" y="122" text-anchor="middle" font-size="13" fill="#ffffff">2. Pull a model (qwen2.5:3b)</text>
<line x1="210" y1="134" x2="210" y2="140" stroke="#55557f" stroke-width="2"/>
<polygon points="210,146 205,139 215,139" fill="#55557f"/>
<rect x="60" y="146" width="300" height="34" rx="4" fill="#55557f"/>
<text x="210" y="168" text-anchor="middle" font-size="13" fill="#ffffff">3. Run Open WebUI</text>
<line x1="210" y1="180" x2="210" y2="186" stroke="#55557f" stroke-width="2"/>
<polygon points="210,192 205,185 215,185" fill="#55557f"/>
<rect x="60" y="192" width="300" height="34" rx="4" fill="#55557f"/>
<text x="210" y="214" text-anchor="middle" font-size="13" fill="#ffffff">4. Open localhost:3000</text>
<text x="210" y="258" text-anchor="middle" font-size="12" fill="#666666">All on your own laptop — no cloud</text>
</svg>
