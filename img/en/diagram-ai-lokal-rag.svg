<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="420" height="330" rx="8" fill="#ffffff"/>
<text x="210" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">Local RAG flow: documents → embeddings</text>
