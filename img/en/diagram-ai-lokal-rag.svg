<rect x="60" y="56" width="300" height="32" rx="4" fill="#55557f"/>
<text x="210" y="77" text-anchor="middle" font-size="13" fill="#ffffff">Documents (PDF / notes)</text>
<line x1="210" y1="88" x2="210" y2="93" stroke="#55557f" stroke-width="2"/>
<polygon points="210,98 205,92 215,92" fill="#55557f"/>
<rect x="60" y="98" width="300" height="32" rx="4" fill="#55557f"/>
<text x="210" y="119" text-anchor="middle" font-size="13" fill="#ffffff">Chunks (text pieces)</text>
<line x1="210" y1="130" x2="210" y2="135" stroke="#55557f" stroke-width="2"/>
<polygon points="210,140 205,134 215,134" fill="#55557f"/>
<rect x="60" y="140" width="300" height="32" rx="4" fill="#55557f"/>
<text x="210" y="161" text-anchor="middle" font-size="13" fill="#ffffff">Embeddings (nomic-embed-text)</text>
<line x1="210" y1="172" x2="210" y2="177" stroke="#55557f" stroke-width="2"/>
<polygon points="210,182 205,176 215,176" fill="#55557f"/>
<rect x="60" y="182" width="300" height="32" rx="4" fill="#55557f"/>
<text x="210" y="203" text-anchor="middle" font-size="13" fill="#ffffff">Vector DB</text>
<line x1="210" y1="214" x2="210" y2="219" stroke="#55557f" stroke-width="2"/>
<polygon points="210,224 205,218 215,218" fill="#55557f"/>
<rect x="60" y="224" width="300" height="32" rx="4" fill="#55557f"/>
<text x="210" y="245" text-anchor="middle" font-size="13" fill="#ffffff">Retrieval (find the relevant bits)</text>
<line x1="210" y1="256" x2="210" y2="261" stroke="#55557f" stroke-width="2"/>
<polygon points="210,266 205,260 215,260" fill="#55557f"/>
<rect x="60" y="266" width="300" height="32" rx="4" fill="#55557f"/>
<text x="210" y="287" text-anchor="middle" font-size="13" fill="#ffffff">Answer + citations</text>
<text x="210" y="318" text-anchor="middle" font-size="12" fill="#666666">All on your own laptop — no cloud</text>
</svg>
