<svg xmlns="http://www.w3.org/2000/svg" width="420" height="422" viewBox="0 0 420 422" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="420" height="422" rx="8" fill="#ffffff"/>
<text x="210" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c2c2c">How to build a tank bot</text>
<rect x="20" y="44" width="380" height="54" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<circle cx="48" cy="71" r="14" fill="#55557f"/>
<text x="48" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
<text x="72" y="67" font-size="15" font-weight="bold" fill="#2c2c2c">Sign up &amp; create a bot</text>
<text x="72" y="85" font-size="12" fill="#666666">create an account, keep your API key safe</text>
<polygon points="210,114 202,102 218,102" fill="#55557f"/>
<rect x="20" y="120" width="380" height="54" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<circle cx="48" cy="147" r="14" fill="#55557f"/>
<text x="48" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
<text x="72" y="143" font-size="15" font-weight="bold" fill="#2c2c2c">Write a controller</text>
<text x="72" y="161" font-size="12" fill="#666666">draft a squad, set movement and shooting</text>
<polygon points="210,190 202,178 218,178" fill="#55557f"/>
<rect x="20" y="196" width="380" height="54" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<circle cx="48" cy="223" r="14" fill="#55557f"/>
<text x="48" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
<text x="72" y="219" font-size="15" font-weight="bold" fill="#2c2c2c">Local testing</text>
<text x="72" y="237" font-size="12" fill="#666666">fight house bots on many seeds</text>
<polygon points="210,266 202,254 218,254" fill="#55557f"/>
<rect x="20" y="272" width="380" height="54" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<circle cx="48" cy="299" r="14" fill="#55557f"/>
<text x="48" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
<text x="72" y="295" font-size="15" font-weight="bold" fill="#2c2c2c">Activate the bot</text>
<text x="72" y="313" font-size="12" fill="#666666">upload the version that passed testing</text>
<polygon points="210,342 202,330 218,330" fill="#55557f"/>
<rect x="20" y="348" width="380" height="54" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<circle cx="48" cy="375" r="14" fill="#55557f"/>
<text x="48" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5</text>
<text x="72" y="371" font-size="15" font-weight="bold" fill="#2c2c2c">Fight in the arena</text>
<text x="72" y="389" font-size="12" fill="#666666">ladder and cups run automatically</text>
</svg>
