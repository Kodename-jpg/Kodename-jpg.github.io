<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="420" height="280" rx="8" fill="#ffffff"/>
<text x="210" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c2c2c">FAT32 vs exFAT for a Ventoy flash drive</text>
<rect x="20" y="44" width="185" height="170" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<text x="112" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">FAT32</text>
<text x="34" y="102" font-size="13" fill="#2e7d32">&#10003; Detected on phones</text>
<text x="34" y="126" font-size="13" fill="#2e7d32">&#10003; ISOs under 4 GB</text>
<text x="34" y="150" font-size="13" fill="#b71c1c">&#10007; Files over 4 GB</text>
<text x="34" y="170" font-size="13" fill="#666666">can't be stored</text>
<rect x="215" y="44" width="185" height="170" rx="8" fill="#f4f4f4" stroke="#55557f" stroke-width="1.5"/>
<text x="307" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c2c2c">exFAT</text>
<text x="229" y="102" font-size="13" fill="#2e7d32">&#10003; Large ISOs can be stored</text>
<text x="229" y="126" font-size="13" fill="#b71c1c">&#10007; Often not detected</text>
<text x="229" y="150" font-size="13" fill="#666666">on phones</text>
<text x="210" y="242" text-anchor="middle" font-size="13" fill="#666666">Choose FAT32 if your ISO is under 4 GB and</text>
<text x="210" y="262" text-anchor="middle" font-size="13" fill="#666666">you want the flash drive detected on your phone.</text>
</svg>
